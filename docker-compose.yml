services:
  reverse-proxy:
    build: ./reverse-proxy
    ports:
      - "8000:8000"
    depends_on:
      - vectorbackend
      - backend

  vectorbackend:
    build: ./vectorbackend
    ports:
      - "4000:4000"
    depends_on:
      - qdrant
    environment:
      - MONGO_URI=mongodb://mongo:27017/yourdatabase # MongoDB connection string

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - vectorbackend
      - qdrant
      - redis
      - otel-collector
    environment:
      - ENV=local
      - OTEL_SERVICE_NAME=letshost-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_HEADERS=${BACKEND_OTEL_EXPORTER_OTLP_HEADERS}

  embedder:
    build: ./embedder
    ports:
      - "7860:7860"
    environment:
      - QDRANT_URI=http://qdrant:6333
      - QDRANT_API_KEY=qdrant
      - REDIS_URI=redis://redis:6379
      - REDIS_PORT=6379
      - REDIS_UNAME=default
      - REDIS_PASSWORD=password

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

  qdrant:
    image: qdrant/qdrant:v1.1.1
    ports:
      - "6333:6333"
    environment:
      - QDRANT_PORT=6333
      - QDRANT_GRPC_PORT=6334
      - QDRANT_JWT_SECRET=secret
      - QDRANT_UPDATE_JWT_SECRET=secret
    command:
      - --cluster
    depends_on:
      - mongo

  redis:
    image: redis:7.0.10
    ports:
      - "6379:6379"

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/local-config.yaml"]

  loki-gateway:
    image: nginx:1.27-alpine
    ports:
      - "3100:3100"
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache apache2-utils >/dev/null && \
        htpasswd -bc /etc/nginx/.htpasswd "$${OBS_AUTH_USER}" "$${OBS_AUTH_PASS}" && \
        nginx -g 'daemon off;'
    environment:
      - OBS_AUTH_USER=${OBS_AUTH_USER}
      - OBS_AUTH_PASS=${OBS_AUTH_PASS}
    volumes:
      - ./observability/loki-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4318:4318"
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      - OTEL_INGEST_HTPASSWD=${OTEL_INGEST_HTPASSWD}
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./observability/grafana/provisioning/datasources/loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
    depends_on:
      - loki

volumes:
  mongo_data:
